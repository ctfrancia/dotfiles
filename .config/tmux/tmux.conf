set-option -sa terminal-overrides ",xterm*:Tc"

# mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Set the prefix to Ctrl-space
#   unbind C-b
#   set -g prefix C-Space
#   bind C-Space send-prefix

# Smart pane switching with awareness of vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
# https://github.com/christoomey/vim-tmux-navigator/issues/418#issuecomment-2527057771
bind-key -n 'C-h' if-shell '~/dotfiles/.config/tmux/is_vim.sh' 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell '~/dotfiles/.config/tmux/is_vim.sh' 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell '~/dotfiles/.config/tmux/is_vim.sh' 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell '~/dotfiles/.config/tmux/is_vim.sh' 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
#   bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
#   bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
#   bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
#   bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Shift Alt vim keys
bind -n M-H previous-window
bind -n M-L next-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# after splitting pane h/v change to the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Check the current user and run specific commands
# TODO: this is not working
if-shell '[ "$USER" = "christian.francia" ]' ' \
    # Commands for user1
    # set-option -g status-bg blue \
    echo "User is christian.francia" \
'

run '~/dotfiles/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'
run '~/.tmux/plugins/tpm/tpm'
